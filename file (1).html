<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আধুনিক লগইন পেজ</title>
    <style>
        /* সুন্দর ডিজাইনের জন্য CSS */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box; /* প্যাডিং ঠিক রাখার জন্য */
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 8px rgba(118, 75, 162, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #764ba2;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #5a387d;
        }

        .footer-text {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }

        .footer-text a {
            color: #764ba2;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>লগইন করুন</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">ইমেইল ঠিকানা</label>
                <input type="email" id="email" placeholder="example@mail.com" required>
            </div>
            <div class="input-group">
                <label for="password">পাসওয়ার্ড</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">প্রবেশ করুন</button>
        </form>
        <div class="footer-text">
            অ্যাকাউন্ট নেই? <a href="#">নতুন তৈরি করুন</a>
        </div>
    </div>

    <script>
        // বাটনে ক্লিক করলে কি হবে তার জন্য সিম্পল জাভাস্ক্রিপ্ট
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // পেজ রিফ্রেশ হওয়া বন্ধ করবে
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            alert("লগইন করার চেষ্টা করছেন:\nইমেইল: " + email + "\nপাসওয়ার্ড: " + password + "\n\n(এটি শুধু একটি ডেমো পেজ)");
        });
    </script>

</body>
</html>
